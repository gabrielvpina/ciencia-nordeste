name: CI

on:
  push:
  pull_request:

jobs:
  ingest:
    name: Python (ruff + mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ingest/requirements.txt -r ingest/requirements-dev.txt
      - run: ruff check ingest --select E,F,W,I --ignore E501
      - run: mypy --config-file ingest/pyproject.toml ingest   # a configuração (ignore_missing_imports) fica em ingest/

  web:
    name: App (typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  migracoes:
    name: Migrações num Postgres vazio
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16   # mesma imagem do docker-compose (migração 0007 usa pgvector)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Aplica todas as migrações em ordem, duas vezes (devem ser idempotentes)
        run: |
          for rodada in 1 2; do
            for f in ingest/sql/migracoes/*.sql; do
              echo "rodada $rodada: $f"
              psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -q --single-transaction -f "$f"
            done
          done
