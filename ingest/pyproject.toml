[project]
name = "ingest"
version = "0.1.0"
description = "Camada de dados (ingestão) da plataforma de pesquisadores brasileiros"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
